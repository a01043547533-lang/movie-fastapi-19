# main 브랜치에 push하면 AWS EC2 서버에 자동 배포합니다.
# (GitHub 저장소 > Actions 탭에서 "Run workflow"로 직접 실행할 수도 있습니다.)
#
# 필요한 GitHub Secrets (Settings > Secrets and variables > Actions)
#   EC2_SSH_KEY      : 서버 접속용 개인키(.pem) 내용 전체
#   EC2_KNOWN_HOSTS  : 서버 호스트 키 (ssh-keyscan 결과, 가짜 서버 접속 방지)
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # 배포 도중 끊기지 않게 순서대로 실행

permissions:
  contents: read

env:
  EC2_HOST: 3.105.22.205
  EC2_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      # 서버에 올리기 전에 빌드 오류를 먼저 잡습니다
      - name: 프론트엔드 빌드 확인
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend

      - name: 백엔드 문법 확인
        run: python3 -m py_compile backend/main.py


      - name: 서버에 업로드하고 배포
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # 윈도우에서 복사하면 섞이는 \r 제거
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

          # Secret 값 점검 (값은 출력하지 않음)
          [ -n "$SSH_KEY" ] || { echo "::error::EC2_SSH_KEY Secret이 비어 있습니다"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::EC2_KNOWN_HOSTS Secret이 비어 있습니다"; exit 1; }
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::EC2_SSH_KEY 형식이 잘못됐습니다 (BEGIN~END 줄까지 전체를 넣었는지 확인)"; exit 1; }
          ssh-keygen -F "$EC2_HOST" -f ~/.ssh/known_hosts > /dev/null \
            || { echo "::error::EC2_KNOWN_HOSTS 에 $EC2_HOST 줄이 없습니다"; exit 1; }
          echo "Secret 점검 통과"
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20"

          tar czf /tmp/app.tgz \
            --exclude=./.git --exclude=./.github --exclude=./.vscode \
            --exclude='*/node_modules' --exclude='*/dist' --exclude='*/venv' \
            --exclude='*/__pycache__' --exclude='*/.env' .

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes /tmp/app.tgz "$EC2_USER@$EC2_HOST:/tmp/movie-app.tgz"
          $SSH "$EC2_USER@$EC2_HOST" 'bash -s' < scripts/deploy-remote.sh

      - name: 외부 접속 확인
        run: |
          curl -fsS --retry 5 --retry-delay 3 "http://$EC2_HOST/" -o /dev/null
          curl -fsS --retry 5 --retry-delay 3 "http://$EC2_HOST/api/health"
          echo
          echo "배포 완료: http://$EC2_HOST"
